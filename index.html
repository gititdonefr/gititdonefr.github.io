<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Access Code</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
    }

    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .card h1 {
      margin: 0 0 1.5rem;
      font-size: 1.25rem;
      color: #1e1e2f;
      font-weight: 600;
    }

    #code {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      border: 2px solid #e0e0e8;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
      letter-spacing: 0.05em;
    }

    #code:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15);
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #6c63ff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #5a52e0;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.2em;
      color: #e0525a;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Enter your access code</h1>
  <input id="code" placeholder="e.g. pi314" autocomplete="off">
  <button onclick="go()">Continue</button>
  <div id="message"></div>
</div>

<script src="gate.js"></script>
<script>
  function go() {
    const code = document.getElementById('code').value.trim();
    const messageEl = document.getElementById('message');
    const slug = CODES[code];

    if (slug) {
      messageEl.style.color = '#3aa76d';
      messageEl.textContent = 'Code accepted, redirecting…';
      setTimeout(() => {
        location.href = slug + '/';
      }, 400);
    } else {
      messageEl.style.color = '#e0525a';
      messageEl.textContent = 'Invalid code, please try again.';
    }
  }

  document.getElementById('code').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') go();
  });
</script>

</body>
</html>
